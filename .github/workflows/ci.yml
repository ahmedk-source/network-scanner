name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (editable + dev extras)
        run: python -m pip install ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Format check
        run: python -m ruff format --check src tests

      - name: Type check (strict on src/)
        run: python -m mypy

      - name: Tests with coverage (gate: 90%)
        run: python -m pytest --cov=netscan --cov-report=term-missing -q

      - name: Smoke-test the CLI on loopback only
        run: |
          python -m netscan scan 127.0.0.1 -p 22,80 --dry-run
          python -m netscan ports common --format json > ports.json
          python -m netscan scan 127.0.0.1 -m none -p 1-10 --format json > scan.json
